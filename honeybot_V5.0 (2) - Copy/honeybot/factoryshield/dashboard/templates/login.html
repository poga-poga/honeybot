<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — FactoryShield</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center;
            padding: 24px; color: #e2e8f0; background: #0b1120;
            font-family: Inter, system-ui, sans-serif;
        }
        .login-card {
            width: min(100%, 420px); padding: 32px; border-radius: 18px;
            background: #111c30; border: 1px solid #26364f;
            box-shadow: 0 24px 70px rgba(0,0,0,.35);
        }
        h1 { margin: 0 0 8px; font-size: 1.7rem; }
        p { color: #94a3b8; line-height: 1.5; }
        label { display: block; margin: 18px 0 7px; color: #cbd5e1; }
        input {
            width: 100%; padding: 12px 14px; border-radius: 9px;
            border: 1px solid #334155; background: #0b1120; color: #f8fafc;
            font: inherit;
        }
        button {
            width: 100%; margin-top: 24px; padding: 13px; border: 0;
            border-radius: 9px; background: #2563eb; color: white;
            font: inherit; font-weight: 700; cursor: pointer;
        }
        button:hover { background: #1d4ed8; }
        .error {
            margin-top: 18px; padding: 12px; border-radius: 8px;
            color: #fecaca; background: rgba(127,29,29,.35);
            border: 1px solid rgba(248,113,113,.35);
        }
        .brand { margin-bottom: 22px; font-size: 1.1rem; color: #93c5fd; }
        .hint { font-size: .85rem; }
    </style>
</head>
<body>
    <main class="login-card">
        <div class="brand">🛡️ FactoryShield</div>
        <h1>Dashboard sign in</h1>
        <p>Sign in with the FactoryShield administrator account to access monitoring data.</p>
        {% if error %}
            <div class="error" role="alert">{{ error }}</div>
        {% endif %}
        <form method="post" action="{{ url_for('login', next=request.args.get('next', '')) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <label for="username">Administrator username</label>
            <input id="username" name="username" type="text" autocomplete="username" required autofocus>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="submit">Sign in</button>
        </form>
        <p class="hint">Access is restricted to authorized administrators.</p>
    </main>
</body>
</html>
